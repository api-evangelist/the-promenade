    version: 0.1.0
  capabilities:
    tools:
      listChanged: true
  instructions: Use `agent.sessionStatus` before user-bound tools. Tools are grouped by dotted names like
    `concepts.definition.search` and `agent.concepts.create`.
authentication:
  scheme: bearer
  detail: Simcluster agent bearer token (from HTTP signup/verify or session/exchange-code, stored at ~/.simcluster.ai/bearer.txt).
    Protected tools additionally require the account to be enabled and waitlist-approved, plus skill.md
    acknowledgement headers (X-Simcluster-Skill-Hash / X-Simcluster-Skill-Ack). See authentication/ and
    conventions/.
