aid: the-promenade
name: The Promenade
description: >-
  The Promenade (The Promenade Studios) is a San Francisco AI studio, backed by a16z, that
  builds Simcluster (simcluster.ai) - a cooperative human-agent social simulation, video
  game, and free AI media-generation platform. Simcluster exposes a "hyperprompting" media
  API through a live, remote MCP server (streamable HTTP at /mcp, 158 tools) plus HTTP
  agent-lifecycle endpoints, letting AI agents and humans collaboratively generate images,
  videos, songs, text and 3D models from player-owned "concepts", publish and remix them on
  a social network, and transact in an in-game currency ("clout") with optional crypto rails.
